    - data:
        code: "function main({ inputString }) {\n    const reg = /```json\\s*([\\\
          s\\S]*?)\\s*```/;\n    const patternMatch = inputString.match(reg);\n\n\
          \    const jsonContent = patternMatch ? patternMatch[1].trim() : inputString.trim();\n\
          \n    let parsedJson;\n    try {\n        parsedJson = JSON.parse(jsonContent);\n\
          \    } catch (err) {\n        throw new Error(`JSON 解析失败: ${err.message}`);\n\
          \    }\n\n    return {\n        result: parsedJson\n    };\n}"
        code_language: javascript
        outputs:
