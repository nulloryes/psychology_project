          name: 用户进行日常问候（你好、早上好）、感谢、告别、询问心理学知识（如“为什么人会做梦”、“什么是焦虑症”）、询问AI的身份或功能等，以及用户的输入与以下三个分类（心理安慰、预约医师、重置）都无关时选择该分类。关键词：你好、谢谢、再见、为什么、是什么、心理学、心理现象。
        - id: '2'
