          \    // 示例：args = \"[{\\\"sql\\\": \\\"INSERT ...\\\"}]\"\n    const raw\
          \ = args || '';\n    if (!raw) return { result: '' };\n\n    try {\n   \
          \     const parsed = JSON.parse(raw);\n        // parsed 是数组 [{ sql: \"\
          INSERT ...\" }]\n        const sql = parsed?.[0]?.sql || parsed?.sql ||\
          \ '';\n        return { result: sql };\n    } catch (e) {\n        // 解析失败，用正则兜底\n\
          \        const match = raw.match(/INSERT\\s+.*?;/i);\n        return { result:\
          \ match ? match[0] : '' };\n    }\n}"
