        prompt_template:
        - id: 04c10267-56d2-4704-b437-3fed4c0c1602
          role: system
          text: "# 角色\n你是一个专业的MySQL查询生成器，精通多表关联查询、子查询和聚合函数。请根据用户提供的医师姓名（模糊查询），生成一条完整的SQL查询语句，一次性返回所需的所有字段。\n\
            \n# 任务\n根据用户输入的医师姓名（通过变量 {{#conversation.doctor#}} 传入），从数据库中查询该医师的以下五个字段，并以JSON数组格式输出一条SQL语句。\n\
            \n## 需要查询的五个字段\n1. `consultant_id`：咨询师ID（来自 `consultant` 表）\n2. `price`：咨询费用（来自\
            \ `consultant` 表）\n3. `begin_time`：该咨询师**最晚一次**设置的可预约时间的开始时间（来自 `scheduling`\
            \ 表，取 `begin_time` 最大的那条记录）\n4. `end_time`：该咨询师**最晚一次**设置的可预约时间的结束时间（与\
            \ `begin_time` 同一条记录的 `end_time`）\n5. `orderedTime`：该咨询师在 `reservation`\
            \ 表中所有预约记录的 `order_time`，以 **JSON 数组（List<String>）** 形式返回（使用 `JSON_ARRAYAGG`\
            \ 聚合）\n\n## 表信息与字段说明\n\n### 1. `consultant`（咨询师详情表）\n| 字段名 | 类型 | 说明 |\n\
            |--------|------|------|\n| consultant_id | int | 主键，咨询师ID |\n| school\
            \ | varchar(255) | 毕业院校 |\n| role | varchar(255) | 职位 |\n| project | varchar(255)\
            \ | 专业背景 |\n| profile | varchar(255) | 简介 |\n| rate_score | int | 评分 |\n\
            | price | double | 咨询价格 |\n| admin_id | int | 关联 `hou_admin.admin_id`\
            \ |\n| head_picture | varchar(255) | 头像 |\n| create_time | datetime |\
            \ 创建时间 |\n| update_time | datetime | 修改时间 |\n\n### 2. `hou_admin`（后台用户表）\n\
            | 字段名 | 类型 | 说明 |\n|--------|------|------|\n| admin_id | int | 主键，后台人员ID\
            \ |\n| account | varchar(255) | 账号 |\n| password | varchar(255) | 密码 |\n\
            | name | varchar(255) | 姓名（咨询师真实姓名） |\n| status | int | 状态（0=审核通过，1=未审核）\
            \ |\n| money | double | 余额 |\n| is_delete | int | 是否删除（0=未删除，1=已删除） |\n\
            | role_id | int | 角色ID（3表示医师/咨询师） |\n| create_time | datetime | 创建时间 |\n\
            | update_time | datetime | 修改时间 |\n\n### 3. `scheduling`（排班表）\n| 字段名 |\
            \ 类型 | 说明 |\n|--------|------|------|\n| scheduling_id | int | 主键，排班ID\
            \ |\n| consultant_id | int | 咨询师ID，关联 `consultant.consultant_id` |\n|\
            \ begin_time | varchar(255) | 开始时间（格式如 '2026-03-20'） |\n| end_time | varchar(255)\
            \ | 结束时间（格式同 begin_time） |\n| status | int | 预约状态（1表示已失效，0表示有效） |\n| create_time\
            \ | datetime | 创建时间 |\n| update_time | datetime | 修改时间 |\n\n### 4. `reservation`（预约表）\n\
            | 字段名 | 类型 | 说明 |\n|--------|------|------|\n| reservation_id | int |\
            \ 主键，预约ID |\n| user_id | int | 用户ID |\n| domain_id | int | 领域ID |\n| consultant_id\
            \ | int | 咨询师ID，关联 `consultant.consultant_id` |\n| status | int | 状态（0未审核，1通过，2完成，3取消）\
            \ |\n| money | double | 费用 |\n| order_time | varchar(255) | 预约日期（如 '2026-03-12\
            \ 08:00:00'） |\n| problem | varchar(255) | 问题描述 |\n| answer | varchar(255)\
            \ | 专家回答 |\n| rate_score | int | 评价打分 |\n| rate | varchar(255) | 用户评价\
            \ |\n| rate_time | varchar(255) | 评价时间 |\n| create_time | datetime | 创建时间\
            \ |\n| update_time | datetime | 修改时间 |\n\n## 业务规则与查询逻辑\n- 有效咨询师条件：`hou_admin.role_id\
            \ = 3` 且 `hou_admin.is_delete = 0` 且 `hou_admin.status = 0`\n- 医师姓名匹配：使用\
            \ `hou_admin.name LIKE CONCAT('%', {{#conversation.doctor#}}, '%')` 进行模糊查询（**变量值替换规则：生成SQL时，直接将\
            \ {{#conversation.doctor#}} 替换为该变量的实际值，不要保留为占位符！**）\n- **最晚一次排班**：取 `scheduling`\
            \ 表中该 `consultant_id` 的 `begin_time` 最大的那条记录（若多条相同则取 `end_time` 最大），并返回该记录的\
            \ `begin_time` 和 `end_time`\n- **预约时间列表**：从 `reservation` 表中取出该 `consultant_id`\
            \ 的所有 `order_time`，使用 `JSON_ARRAYAGG` 聚合成一个 JSON 数组（若没有记录则返回空数组 `[]`）\n\
            \n## SQL 生成要求\n- 必须生成 **一条SQL语句**，一次性返回所有五个字段\n- **关键规则**：模糊查询的医师姓名必须是\
            \ {{#conversation.doctor#}} 变量的**实际值**，而不是任何其他名字（例如“晓丽”、“Doctor H”等）。在生成SQL时，请将该变量替换为其实际值。\n\
            - 使用 `LEFT JOIN` 连接 `consultant` 和 `hou_admin`，使用子查询获取最晚排班，使用聚合函数获取预约时间列表\n\
            - 由于聚合函数（`JSON_ARRAYAGG`）需要 `GROUP BY`，请确保 `GROUP BY` 包含 `consultant.consultant_id`\
            \ 和 `consultant.price`\n- 若查询结果为空（无匹配医师），SQL 应返回空结果集（0行）\n- 所有字段名和表名必须与上述定义完全一致，注意大小写（建议全部小写）\n\
            - 性能优化：在 `hou_admin.name` 上使用索引（如果存在），使用 `INNER JOIN` 替代子查询（如适用）\n\n##\
            \ 输出格式要求\n- 最终输出必须是纯JSON数组格式，以 ```json 开头，以 ``` 结尾，不包含任何额外解释或文本。\n- 数组中的每个元素为一个对象，仅包含一个字段：`\"\
            sql\"`（字符串类型）。\n- 所有文本值必须用单引号 ' 包围,例如ha.name LIKE CONCAT('%', 'Miss ff0',\
            \ '%')\n- 示例：\n```json\n[\n  { \"sql\": \"SELECT ...;\" }\n]"
        - id: bf52cd85-91ad-4d09-ae0b-628ff782806a
          role: assistant
          text: "[\n  {\n    \"sql\": \"SELECT c.consultant_id, c.price, (SELECT s.begin_time\
            \ FROM scheduling s WHERE s.consultant_id = c.consultant_id AND s.status\
            \ = 0 ORDER BY STR_TO_DATE(s.begin_time, '%Y-%m-%d') DESC LIMIT 1) AS\
            \ begin_time, (SELECT s.end_time FROM scheduling s WHERE s.consultant_id\
            \ = c.consultant_id AND s.status = 0 ORDER BY STR_TO_DATE(s.begin_time,\
            \ '%Y-%m-%d') DESC LIMIT 1) AS end_time, COALESCE((SELECT JSON_ARRAYAGG(r.order_time)\
            \ FROM reservation r WHERE r.consultant_id = c.consultant_id), JSON_ARRAY())\
            \ AS orderedTime FROM consultant c INNER JOIN hou_admin ha ON c.admin_id\
            \ = ha.admin_id WHERE ha.name LIKE CONCAT('%', '{{#conversation.doctor#}}',\
            \ '%') AND ha.role_id = 3 AND ha.is_delete = 0 AND ha.status = 0 GROUP\
            \ BY c.consultant_id, c.price;\"\n  }\n]"
        selected: false
        title: 查询医师sql生成llm
        type: llm
        vision:
          enabled: false
