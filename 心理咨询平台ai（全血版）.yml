    - data:
        instruction: '【指令一·条件判断】

          若会话变量 problem 和 domain 均已有值（即 {{#conversation.problem#}} 与 {{#conversation.domain#}}
          均不为空），则本节点不再对这两个字段进行提取，直接跳过。


          【指令二·医师姓名提取】

          当用户输入中提及医师姓名时，请准确提取医师姓名，存入 doctor 字段。提取规则如下：

          - 优先提取“预约”、“找”、“联系”、“挂号”、“约”、“想看”、“咨询”等动词后面紧跟的人名或称呼

          - 支持中文姓名（如“晓丽”、“李昊游”、“张伟”）和英文名/称呼（如“Doctor H”、“Dr. Smith”）

          - 若姓名后带有职称后缀（如“医师”、“医生”、“咨询师”、“主任”），只提取姓名部分，不包含职称

          - 若用户未提及任何医师姓名，则 doctor 字段返回空字符串


          示例：

          用户：“我想预约晓丽医师” → 提取：晓丽

          用户：“帮我预约李昊游咨询师” → 提取：李昊游

          用户：“请约Doctor H” → 提取：Doctor H

          用户：“我想找张伟医生” → 提取：张伟

          用户：“你好，我最近睡不好” → 提取：（空）


          【指令三·领域归类】

          当需要提取 domain 时，请根据用户当前描述，从以下五个选项中选出最匹配的一项，并将对应的数字存入 domain 字段：

          - 1 = 头疼：与紧张、压力相关的头部不适，如紧箍感、搏动性疼痛

          - 2 = 失眠：入睡困难、早醒、多梦、睡眠质量差或睡不解乏

          - 3 = 焦虑：过度担忧、紧张不安、心慌、坐立难安、难以放松

          - 4 = 躯体化：无明显生理病因的身体不适，如胃痛、胸闷、乏力、麻木等

          - 5 = 神经敏感：情绪易波动、对外界刺激反应过度、容易被惊吓或感到烦躁


          【指令四·问题提取】

          当需要提取 problem 时，从用户描述中提取核心心理问题，用一句简洁的中文短句概括（不超过30字）。若用户未表达任何心理困扰，则 problem
          返回空字符串。'
