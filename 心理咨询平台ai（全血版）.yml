  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: '### 今天你想问我点什么呢٩(>◡<)۶，我可以倾听你的内心烦恼，帮你匹配适配的咨询师📩

      如若你想直接预约医师请和我说预约医师，并告诉我

      - 您正在苦恼的事情

      - 您当下的情绪或症状

      - 想要预约的咨询师

      之后我在向你确认一下期望的预约时间段就好啦❤️


      接下来让我们一同开启心理疏导之旅吧٩(๑>◡<๑)۶'
