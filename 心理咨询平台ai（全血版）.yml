            \ FROM consultant c INNER JOIN hou_admin h ON c.admin_id = h.admin_id\
            \ INNER JOIN consultant_domain cd ON c.consultant_id = cd.consultant_id\
            \ INNER JOIN domain d ON cd.domain_id = d.domain_id WHERE d.domain_id\
            \ = 3 AND h.role_id = 3 AND h.is_delete = 0 AND h.status = 0 ORDER BY\
            \ c.rate_score DESC;\"\n  },\n  {\n    \"title\": \"按价格从低到高查询焦虑领域咨询师（仅前5名）\"\
            ,\n    \"sql\": \"SELECT h.name AS consultant_name, c.role, c.profile,\
