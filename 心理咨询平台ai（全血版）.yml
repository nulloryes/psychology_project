    - data:
        code: "function main({ args }) {\n    // 收集所有结果对象\n    const allItems = [];\n\
          \    for (const arg of args) {\n        if (arg.result && Array.isArray(arg.result))\
          \ {\n            allItems.push(...arg.result);\n        }\n    }\n    \n\
          \    // 按 consultant_name 去重\n    const uniqueMap = new Map();\n    for\
          \ (const item of allItems) {\n        if (item.consultant_name && !uniqueMap.has(item.consultant_name))\
          \ {\n            uniqueMap.set(item.consultant_name, item);\n        }\n\
          \    }\n    \n    // 生成格式化字符串\n    const lines = [];\n    for (const [name,\
          \ item] of uniqueMap) {\n        const role = item.role || '未知职位';\n   \
          \     const rate = item.rate_score ?? '暂无评分';\n        const price = item.price\
          \ ?? '暂无价格';\n        const profile = item.profile || '暂无简介';\n        lines.push(`${name}（${role}）：平均评分为\
          \ ${rate} 星，咨询价格为 ${price} 元， 其个人简历：${profile}`);\n    }\n    \n    return\
          \ {\n        result: lines.join('\\n')\n    };\n}"
